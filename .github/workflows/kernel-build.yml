name: Mainline kernel CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kernel-build.yml"
      - "README.md"
      - "docs/**"
      - "config/**"
      - "dts/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: mainline-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-smoke-build:
    name: Build SM6225 kernel and Spes DTS candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      KERNEL_COMMIT: b8463e4b9111517f89da970d1e1145b851ce8d48
      KERNEL_ARCHIVE: https://gitlab.postmarketos.org/sm6225-mainline/kernels/linux-v.7.2.1/-/archive/b8463e4b9111517f89da970d1e1145b851ce8d48/linux-v.7.2.1-b8463e4b9111517f89da970d1e1145b851ce8d48.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            libelf-dev libssl-dev lld llvm clang make

      - name: Fetch pinned mainline source
        run: |
          set -eux
          mkdir -p kernel-src
          curl --fail --location --retry 3 "$KERNEL_ARCHIVE" -o kernel.tar.gz
          tar -xzf kernel.tar.gz --strip-components=1 -C kernel-src
          test -f kernel-src/Makefile
          echo "$KERNEL_COMMIT" > kernel-src/SOURCE_COMMIT

      - name: Configure SM6225 baseline kernel
        working-directory: kernel-src
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/kernel-out"
          cp "$GITHUB_WORKSPACE/config/sm6225-base.config" "$RUNNER_TEMP/kernel-out/.config"
          scripts/kconfig/merge_config.sh -m -O "$RUNNER_TEMP/kernel-out" \
            "$RUNNER_TEMP/kernel-out/.config" \
            "$GITHUB_WORKSPACE/config/spes-candidate.config"
          make ARCH=arm64 LLVM=1 O="$RUNNER_TEMP/kernel-out" olddefconfig

      - name: Compile kernel image
        working-directory: kernel-src
        run: |
          set -eux
          make -j"$(nproc)" ARCH=arm64 LLVM=1 \
            O="$RUNNER_TEMP/kernel-out" Image


      - name: Verify upstream FT5452 driver and Spes bring-up config
        working-directory: kernel-src
        run: |
          set -eux
          grep -qx 'CONFIG_INPUT_TOUCHSCREEN=y' "$RUNNER_TEMP/kernel-out/.config"
          grep -qx 'CONFIG_TOUCHSCREEN_EDT_FT5X06=y' "$RUNNER_TEMP/kernel-out/.config"
          grep -qx 'CONFIG_PSTORE_RAM=y' "$RUNNER_TEMP/kernel-out/.config"
          grep -qx 'CONFIG_POWER_RESET_QCOM_PON=y' "$RUNNER_TEMP/kernel-out/.config"
          ! grep -qx 'CONFIG_TOUCHSCREEN_FTS=y' "$RUNNER_TEMP/kernel-out/.config"
          grep -q 'focaltech,ft5452' drivers/input/touchscreen/edt-ft5x06.c
          grep -q 'focaltech,ft5452' Documentation/devicetree/bindings/input/touchscreen/edt-ft5x06.yaml

      - name: Compile pinned SM6225/tapas DTS reference (not a spes DTB)
        working-directory: kernel-src
        env:
          TAPAS_REF_COMMIT: c5b6ab106f8277908a56b77a6a595d4ad0531dba
          TAPAS_DTS_BLOB: 581500e63039f8f2970103b2918386cc9d56d6a2
        run: |
          set -eux
          DTS_DIR=arch/arm64/boot/dts/qcom
          TAPAS_DTS="$DTS_DIR/sm6225-xiaomi-tapas.dts"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Sype0/pmos-tapas/$TAPAS_REF_COMMIT/dts/sm6225-xiaomi-tapas.dts" \
            -o "$TAPAS_DTS"
          test "$(git hash-object "$TAPAS_DTS")" = "$TAPAS_DTS_BLOB"

          # Reproduce the pinned reference project's patches for this DTS compile.
          while read -r name expected; do
            [ -n "$name" ] || continue
            patch_file="$RUNNER_TEMP/$name"
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/Sype0/pmos-tapas/$TAPAS_REF_COMMIT/patches/$name" \
              -o "$patch_file"
            test "$(git hash-object "$patch_file")" = "$expected"
            patch -p1 --forward < "$patch_file"
          done <<'PATCHES'
          0001-simpledrm-refresh-rate.patch 4a1b2746da7d53f5f8841723db6277366a507f5e
          0002-gcc-sm6225-gpll10-11-lucid.patch d79030efbcc9557e06c13116e633b5a1adce1e30
          0003-wl2866d-reset-lenient-id.patch b194dc1d2c238e0c7d9cb00057dcf26b9cd4a17a
          0004-hci_qca-wcn3950-power-off.patch a38526a76dc783c80ec5b19af465fa5a149e98ea
          0005-simpledrm-scanout-sync.patch fecc836d357acdbc4ef404f6d8a6771822038c72
          0006-s5kjn1-no-50mp-mode.patch 6a241aec328bf004397fe298294002d3f9f72a0a
          PATCHES

          grep -q '^CONFIG_ARCH_QCOM=y$' "$RUNNER_TEMP/kernel-out/.config"
          if ! grep -qF 'sm6225-xiaomi-tapas.dtb' "$DTS_DIR/Makefile"; then
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm6225-xiaomi-tapas.dtb' >> "$DTS_DIR/Makefile"
          fi
          make -j"$(nproc)" ARCH=arm64 LLVM=1 \
            O="$RUNNER_TEMP/kernel-out" qcom/sm6225-xiaomi-tapas.dtb
          test -s "$RUNNER_TEMP/kernel-out/$DTS_DIR/sm6225-xiaomi-tapas.dtb"

      - name: Audit pinned SM6225 reserved-memory definitions
        working-directory: kernel-src
        run: |
          set -eux
          DTSI=arch/arm64/boot/dts/qcom/sm6225.dtsi
          test -f "$DTSI"
          echo "=== Reserved-memory labels and Spes cross-check addresses ==="
          grep -nE 'pil_modem_mem|wlan_msa_mem|0x4ab00000|0x51900000|0x46000000|0x5c000000|0x5cf00000' "$DTSI" || true

      - name: Compile Spes DTS candidate (compile-only, not flashable)
        working-directory: kernel-src
        run: |
          set -eux
          DTS_DIR=arch/arm64/boot/dts/qcom
          cp "$GITHUB_WORKSPACE/dts/sm6225-xiaomi-spes.dts" "$DTS_DIR/sm6225-xiaomi-spes.dts"
          test -f "$DTS_DIR/sm6225.dtsi"
          test -f "$DTS_DIR/pm6125.dtsi"
          if ! grep -qF 'sm6225-xiaomi-spes.dtb' "$DTS_DIR/Makefile"; then
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm6225-xiaomi-spes.dtb' >> "$DTS_DIR/Makefile"
          fi
          make -j"$(nproc)" ARCH=arm64 LLVM=1 \
            O="$RUNNER_TEMP/kernel-out" qcom/sm6225-xiaomi-spes.dtb
          test -s "$RUNNER_TEMP/kernel-out/$DTS_DIR/sm6225-xiaomi-spes.dtb"

      - name: Collect smoke-build output
        if: always()
        run: |
          mkdir -p dist
          if [ -f "$RUNNER_TEMP/kernel-out/arch/arm64/boot/Image" ]; then
            cp "$RUNNER_TEMP/kernel-out/arch/arm64/boot/Image" dist/
          fi
          if [ -f "$RUNNER_TEMP/kernel-out/.config" ]; then
            cp "$RUNNER_TEMP/kernel-out/.config" dist/kernel.config
          fi
          if [ -f "$RUNNER_TEMP/kernel-out/include/config/kernel.release" ]; then
            cp "$RUNNER_TEMP/kernel-out/include/config/kernel.release" dist/kernel.release
          fi
          echo "$KERNEL_COMMIT" > dist/source-commit.txt
          cat > dist/README.txt <<'EOF'
          COMPILE-ONLY SMOKE ARTIFACT — NOT DEVICE-BOOTABLE.
          The Image is a kernel build test. The Spes DTB candidate is compiled
          in CI but is not included in this artifact. No initramfs, verified
          boot image, firmware bundle, or recovery procedure is included.
          Do not flash this artifact to the phone.
          EOF
          du -h dist/* 2>/dev/null || true

      - name: Upload smoke-build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spes-mainline-kernel-smoke-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
